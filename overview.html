<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MachaHub app screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* MachaHub prototype: shared styles. Tokens come from brand/tokens.json. */
:root{
  --teal:#146C68; --coral:#FF705E; --cream:#F8F3E9; --charcoal:#243B3A; --lime:#D8E875;
  --surface:#FFFFFF; --muted:#5A6B69; --line:#E2DACB; --tealTint:#E3EFEC;
  --bg:var(--cream); --card:var(--surface); --text:var(--charcoal); --sub:var(--muted);
  --border:var(--line); --tint:var(--tealTint); --ink:var(--teal); --on-teal:#F8F3E9;
  --page:#EAE3D5; --shadow:0 1px 2px rgba(36,59,58,.04),0 8px 24px rgba(36,59,58,.06);
  --photo1:#E3EFEC; --photo2:#F4EBDD; --disabled-bg:#E3EFEC; --scrim:rgba(17,25,24,.42);
  --fill-teal:#146C68; --peach:#F2DCC8;
  --r-card:18px; --r-btn:16px; --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"]{
  --bg:#111918; --card:#1A2524; --text:#EEF1EC; --sub:#A6B4B1;
  --border:#2B3A38; --tint:#1D3432; --ink:#7FCBC3; --page:#0A0F0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --photo1:#1D3432; --photo2:#22302E; --disabled-bg:#1D3432; --scrim:rgba(0,0,0,.55);
  --fill-teal:#2FA79F; --peach:#3A3229;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= Overview shell ================= */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;background:color-mix(in srgb,var(--page) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .brand{display:flex;align-items:center;gap:10px;font:700 18px Poppins,sans-serif}
.top .brand img{width:32px;height:32px}
.top .brand .wm span{color:var(--ink)}
.top .note{color:var(--sub);font-size:14px}
.top .ctrls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-weight:600;font-size:14px}
.pillgroup{display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--card);padding:3px}
.pillgroup button{min-height:38px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:14px;color:var(--sub)}
.pillgroup button[aria-pressed="true"]{background:var(--teal);color:#F8F3E9}
.shell{display:grid;grid-template-columns:260px 1fr}
.side{position:sticky;top:69px;height:calc(100vh - 69px);overflow-y:auto;padding:20px 12px 40px 20px;border-right:1px solid var(--border)}
.side h4{margin:18px 0 6px;font:600 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.side h4:first-child{margin-top:0}
.side button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--text);min-height:32px;align-items:center}
.side button b{color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;min-width:30px}
.side button:hover,.side button.cur{background:var(--tint);color:var(--ink)}
.flow{padding:24px 32px 80px;min-width:0}
.fgroup{margin-bottom:56px}
.fgroup > header{max-width:820px;margin-bottom:20px}
.fgroup > header h2{font:600 22px Poppins,sans-serif;margin:0 0 6px;color:var(--text)}
.fgroup > header p{margin:0;color:var(--sub);font-size:15px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:40px 32px}
.slot{display:flex;flex-direction:column;gap:10px;width:390px}
.slot .label{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.slot .label b{color:var(--ink);font-variant-numeric:tabular-nums}
.slot .snote{font-size:13px;line-height:1.45;color:var(--sub);min-height:38px;margin:-4px 0 2px}
.flow.play{display:flex;justify-content:center}
.flow.play .fgroup{margin:0}
.flow.play .fgroup:not(:has(.current)),.flow.play .slot:not(.current),.flow.play .fgroup > header{display:none}
.flow.play .row{justify-content:center}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}}
@media (max-width:520px){.top,.flow{padding-left:16px;padding-right:16px}.top .note{display:none}}

/* ================= Phone frame ================= */
.phone{width:390px;height:844px;border-radius:36px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 1px var(--border),0 30px 60px -20px rgba(36,59,58,.25);transition:box-shadow .4s}
.phone.flash{box-shadow:0 0 0 3px var(--ink),0 30px 60px -20px rgba(36,59,58,.35)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:20px 24px 28px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr > *{flex-shrink:0}
.phone.tabbed .scr{padding:16px 20px 110px}
.phone.hasbar .scr{padding-bottom:120px}
.phone.tabbed.hasbar .scr{padding-bottom:190px}
.enter .scr > *{animation:rise .45s var(--ease) both}
.enter .scr > *:nth-child(2){animation-delay:.03s}.enter .scr > *:nth-child(3){animation-delay:.06s}.enter .scr > *:nth-child(4){animation-delay:.09s}.enter .scr > *:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= Type ================= */
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;margin:0;letter-spacing:-.01em;text-wrap:balance}
.phone h1{font-size:26px;line-height:1.2;font-weight:600}
.phone h2{font-size:20px;line-height:1.25;font-weight:600}
.phone h3{font-size:16px;font-weight:600}
.lead{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--sub)}
.cap{font-size:13px;color:var(--sub);line-height:1.45}
.small{font-size:12px;color:var(--sub);line-height:1.45}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.ink{color:var(--ink)}
.strong{font-weight:600;color:var(--text)}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.gap8{display:flex;flex-direction:column;gap:8px}.gap12{display:flex;flex-direction:column;gap:12px}
.hstack{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

/* ================= Buttons ================= */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border-radius:var(--r-btn);border:0;font-weight:600;font-size:16px;text-decoration:none;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--teal);color:#F8F3E9}
.btn-primary:disabled,.btn-primary[aria-disabled="true"]{background:var(--disabled-bg);color:var(--sub);cursor:not-allowed}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);min-height:52px;font-size:15px}
.btn-ghost{background:transparent;color:var(--ink);min-height:48px;font-size:15px}
.btn-danger{background:transparent;color:#B3261E;border:1.5px solid color-mix(in srgb,#B3261E 35%,transparent);min-height:52px;font-size:15px}
[data-theme="dark"] .btn-danger{color:#FFB4AB;border-color:color-mix(in srgb,#FFB4AB 35%,transparent)}
.btn-danger-solid{background:#B3261E;color:#fff}
.btn-sm{min-height:44px;width:auto;padding:0 16px;font-size:14px;border-radius:14px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row > *,.field,.input{min-width:0}
.foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.iconbtn:hover{background:var(--tint)}
.iconbtn.raised{background:var(--card);box-shadow:var(--shadow)}
.textbtn{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:14px;min-height:44px;min-width:44px;padding:0 4px}
.dot-badge{position:relative}
.dot-badge::after{content:"";position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--lime);border:2px solid var(--card)}

/* ================= Surfaces ================= */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card.flat{box-shadow:none;border:1px solid var(--border)}
.tile-ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile-ic.sm{width:36px;height:36px;border-radius:11px}.tile-ic.sm svg{width:19px;height:19px}
.tile-ic.lg{width:52px;height:52px;border-radius:16px}.tile-ic.lg svg{width:26px;height:26px}
.tile-ic.lime{background:var(--lime);color:#243B3A}
.tile-ic.peach{background:var(--peach);color:var(--ink)}
.tile-ic.ghost{background:transparent;border:1px solid var(--border);color:var(--sub)}
.hero-ic{width:88px;height:88px;border-radius:28px;background:var(--tint);color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.hero-ic svg{width:44px;height:44px;stroke-width:1.6}
.hero-ic.dot::after{content:"";position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--lime);border:4px solid var(--bg)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--tint);font-size:14px;line-height:1.45}
.banner svg{color:var(--ink);margin-top:1px}
.banner.lime{background:color-mix(in srgb,var(--lime) 45%,var(--card));color:#243B3A}
[data-theme="dark"] .banner.lime{background:#2E3A1E;color:#EEF1EC}
.banner.warn{background:color-mix(in srgb,var(--coral) 14%,var(--card))}
.banner.warn svg{color:var(--text)}
.divider{height:1px;background:var(--border);margin:16px 0}

/* chips, tags, badges */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:500;color:var(--text);transition:background .2s,border-color .2s,color .2s}
.chip[aria-pressed="true"],.chip[aria-checked="true"],.chip.on{background:var(--tint);border-color:var(--ink);color:var(--ink);font-weight:600}
.chip svg.i{width:16px;height:16px}
.chip.dashed{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--tint);color:var(--ink)}
.tag svg.i{width:15px;height:15px}
.tag.plain{background:transparent;border:1px solid var(--border);color:var(--sub)}
.verified{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 7px;border-radius:999px;background:var(--lime);color:#243B3A;font-size:12px;font-weight:600;white-space:nowrap}
.verified svg.i{width:14px;height:14px;stroke-width:2.2}
.count-badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--lime);color:#243B3A;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--border)}
.status.ok{color:var(--ink)}.status.ok::before{background:var(--fill-teal)}
.status.due::before{background:var(--coral)}
.status.live::before{background:var(--coral);box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 22%,transparent)}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 13px Inter,sans-serif;color:#243B3A;flex-shrink:0;background:#E3EFEC}
.av.a1{background:#E3EFEC}.av.a2{background:#D8E875}.av.a3{background:#F2DCC8}.av.a4{background:#DCE3F0}.av.a5{background:#E8DDF0}
.av.s28{width:28px;height:28px;font-size:11px}.av.s32{width:32px;height:32px;font-size:12px}.av.s48{width:48px;height:48px;font-size:15px}.av.s56{width:56px;height:56px;font-size:17px}.av.s72{width:72px;height:72px;font-size:22px}.av.s96{width:96px;height:96px;font-size:30px;font-family:Poppins,sans-serif}
.avs{display:flex}
.avs .av{border:2.5px solid var(--card);margin-left:-10px}
.avs .av:first-child{margin-left:0}

/* ================= App bars & steps ================= */
.appbar{display:flex;align-items:center;gap:8px;margin:-6px -10px 16px;min-height:48px}
.appbar .ttl{flex:1;font:600 17px Poppins,sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl.left{text-align:left;padding-left:2px}
.appbar .slot-r{min-width:44px;display:flex;justify-content:flex-end}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:48px}
.pagehead h1{font-size:24px}
.stephead{display:flex;align-items:center;gap:12px;margin:-4px -8px 24px}
.progress{flex:1;height:6px;border-radius:99px;background:var(--border);overflow:hidden}
.progress i{display:block;height:100%;background:var(--coral);border-radius:99px}
.stepn{font-size:13px;color:var(--sub);font-weight:600;min-width:44px;text-align:right;padding-right:8px}
.meter{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--fill-teal)}
.meter.coral i{background:var(--coral)}

/* ================= Lists & settings ================= */
.list{padding:4px 0}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:transparent;text-align:left;min-height:60px;color:var(--text)}
.li + .li{border-top:1px solid var(--border)}
.li .t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.li .t b{font-weight:600}
.li .t .cap{display:block}
.li time,.li .meta{font-size:12px;color:var(--sub);white-space:nowrap}
.li .chev{color:var(--sub);width:18px;height:18px}
.li .val{font-size:14px;color:var(--sub)}
.li.danger,.li.danger .t{color:#B3261E}
[data-theme="dark"] .li.danger,[data-theme="dark"] .li.danger .t{color:#FFB4AB}
.sect{margin-top:24px}
.sect:first-child{margin-top:0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px}
.sect-h h3{font-size:16px}
.sect-h .lbl{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em}
/* 52x32 visual track inside a 64x44 tap target */
.switch{width:52px;height:32px;box-sizing:content-box;border:6px solid transparent;background-clip:padding-box;margin:-6px;border-radius:99px;background-color:var(--border);position:relative;flex-shrink:0;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch-hit{min-height:44px;display:flex;align-items:center}

/* ================= Forms ================= */
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .flabel{font-size:14px;font-weight:600}
.input{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--sub)}
.input:focus-within{border-color:var(--ink)}
.input input,.input select{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--text);min-height:48px;min-width:0}
.input input::placeholder,textarea::placeholder{color:var(--sub)}
.input .prefix{font-weight:600;color:var(--text);padding-right:10px;border-right:1px solid var(--border)}
.input.big input{font:600 28px Poppins,sans-serif;letter-spacing:-.5px}
textarea.ta{width:100%;min-height:104px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);font-size:15px;line-height:1.5;color:var(--text);resize:none;outline:0}
textarea.ta:focus{border-color:var(--ink)}
.hint{font-size:12px;color:var(--sub)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:var(--text);padding:0 6px}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--teal);color:#F8F3E9;font-weight:600}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--tint)}
.tabs button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:60px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font:600 24px Poppins,sans-serif}
.otp span.cur{border:2px solid var(--ink)}
.radio-row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:1.5px solid transparent;box-shadow:var(--shadow);min-height:56px}
.radio-row[aria-checked="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--tint) 55%,var(--card))}
.radio-row .t{flex:1;font-size:15px;font-weight:500}
.radio-row .t .cap{display:block;font-weight:400}
.rdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.radio-row[aria-checked="true"] .rdot{border:7px solid var(--teal)}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#F8F3E9}
.cbox svg{width:14px;height:14px;stroke-width:2.6;opacity:0}
[aria-checked="true"] > .cbox{background:var(--teal);border-color:var(--teal)}
[aria-checked="true"] > .cbox svg{opacity:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:4px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--teal) var(--p,30%),var(--border) var(--p,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--teal);margin-top:-11px;box-shadow:0 2px 8px rgba(36,59,58,.2)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--border)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--teal)}
.range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-slot{aspect-ratio:3/4;border-radius:14px;border:1.5px dashed var(--border);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:12px;font-weight:500}
.ph-slot.filled{border:0;background:linear-gradient(160deg,var(--photo1),var(--photo2));color:var(--ink);position:relative}
.ph-slot.filled .ini{font:600 26px Poppins,sans-serif}
.ph-slot .cover{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card);color:var(--text)}
.room{border-radius:14px;background:linear-gradient(160deg,var(--photo2),var(--photo1));display:flex;align-items:center;justify-content:center;color:var(--ink)}
.room svg{width:28px;height:28px;opacity:.75}

/* ================= Bottom nav, sticky bars, toasts, sheets ================= */
.nav{position:absolute;left:0;right:0;bottom:0;height:82px;padding:6px 8px 18px;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:5}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--sub);min-height:52px;border-radius:12px;position:relative}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav button[aria-current="page"] svg{stroke-width:2.1}
.nav .count-badge{position:absolute;top:2px;left:calc(50% + 4px);min-width:18px;height:18px;font-size:10px}
.bar{position:absolute;left:0;right:0;bottom:0;padding:14px 24px 26px;background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:4;display:flex;flex-direction:column;gap:10px}
.phone.tabbed .bar{bottom:82px;padding:14px 20px 12px}
.toast{position:absolute;left:20px;right:20px;bottom:100px;z-index:60;padding:14px 16px;border-radius:14px;background:#243B3A;color:#F8F3E9;font-size:14px;font-weight:500;opacity:0;transform:translateY(8px);transition:.3s var(--ease);pointer-events:none}
[data-theme="dark"] .toast{background:#EEF1EC;color:#243B3A}
.toast.show{opacity:1;transform:none}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 24px 30px;max-height:88%;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 18px}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);z-index:21;background:var(--bg);border-radius:24px;padding:24px}
.ghost-bg{position:absolute;inset:0;padding:16px 20px;opacity:.9;pointer-events:none}

/* shared bits used across flows */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px 16px}
.stat .k{font-size:12px;font-weight:600;color:var(--sub)}
.stat .v{font:600 22px Poppins,sans-serif;margin-top:4px;letter-spacing:-.3px}
.money-pos{color:var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 8px}
.empty .hero-ic{margin-bottom:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:14px}
.kv + .kv{border-top:1px solid var(--border)}
.kv span:first-child{color:var(--sub)}
.kv span:last-child{font-weight:600;text-align:right}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><img data-logo alt=""><span class="wm">Macha<span>Hub</span></span></div>
  <div class="note"><span id="count"></span> · from first launch to deleting your account. Tap any button to move through the app.</div>
  <div class="ctrls">
    <div class="pillgroup" role="group" aria-label="View">
      <button id="vOverview" aria-pressed="true">Overview</button>
      <button id="vPlay" aria-pressed="false">Use like an app</button>
    </div>
    <div class="pillgroup" role="group" aria-label="Zoom">
      <button data-zoom="1" aria-pressed="true">100%</button>
      <button data-zoom=".75" aria-pressed="false">75%</button>
      <button data-zoom=".5" aria-pressed="false">50%</button>
    </div>
    <button class="pill" id="themeBtn" aria-pressed="false">Dark theme</button>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="All screens"></nav>
  <main class="flow" id="flow"></main>
</div>

const ic = (n, style='') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${style?` style="${style}"`:''}>${P[n]||P.info}</svg>`;

const flows = [], screens = [], byId = {};
let cssBuf = '';
const MH = window.MH = {
  icons:P, i:ic,
  flow(id, title, desc){ flows.push({id,title,desc}); },
  screen(s){ s.html = s.html||''; screens.push(s); byId[s.id]=s; if(s.css) cssBuf += s.css; },
  css(str){ cssBuf += str; },
  av:(ini,tone='a1',size='')=>`<span class="av ${tone} ${size}" aria-hidden="true">${ini}</span>`,
  appbar({back=true,title='',right='',left=false}={}){
    const b = back===false ? '<span style="width:44px"></span>'
      : `<button class="iconbtn" ${typeof back==='string'?`data-back="${back}"`:'data-back'} aria-label="Back">${ic('back')}</button>`;
    return `<div class="appbar">${b}<div class="ttl ${left?'left':''}">${title}</div><div class="slot-r">${right}</div></div>`;
  },
  step(n,total,back){
    return `<div class="stephead"><button class="iconbtn" data-back="${back}" aria-label="Back">${ic('back')}</button><div class="progress" role="progressbar" aria-label="Step ${n} of ${total}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${total}"><i style="width:${n/total*100}%"></i></div><span class="stepn">${n} of ${total}</span></div>`;
  },
  logo:(size=104,alt='MachaHub logo')=>`<img data-logo alt="${alt}" style="width:${size}px;height:${size}px">`,
  /* A row in a settings / menu list */
  row({icon,title,sub='',go,toast,val='',chev=true,danger=false,right=''}){
    const act = go?`data-go="${go}"`:toast?`data-toast="${toast}"`:'';
    return `<button class="li ${danger?'danger':''}" ${act}>${icon?`<span class="tile-ic sm ${danger?'ghost':''}">${ic(icon)}</span>`:''}<span class="t"><b>${title}</b>${sub?`<span class="cap">${sub}</span>`:''}</span>${val?`<span class="val">${val}</span>`:''}${right}${chev?ic('chev','width:18px;height:18px;color:var(--sub)'):''}</button>`;
  },
  switchRow({title,sub='',on=false}){
    return `<div class="li" style="cursor:default"><span class="t"><b>${title}</b>${sub?`<span class="cap">${sub}</span>`:''}</span><button class="switch" role="switch" aria-checked="${on}" aria-label="${title}"></button></div>`;
  }
};

const TABS=[['home','Home','home'],['discover','Discover','compass'],['chats','Chats','chat'],['myhome','My Home','key'],['profile','Profile','user']];
const TAB_TARGET={home:'home',discover:'discover',chats:'chats',myhome:'myhome-dash',profile:'profile'};
function nav(active){
  return `<nav class="nav" aria-label="Main">${TABS.map(([k,l,i])=>`<button ${k===active?'aria-current="page"':''} data-go="${TAB_TARGET[k]}">${ic(i)}${l}${k==='chats'?'<span class="count-badge" aria-label="2 unread">2</span>':''}</button>`).join('')}</nav>`;
}

/* ---------- build the overview ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const state={play:false,cur:null,hist:[]};
const LETTERS='ABCDEFGHIJKLMNOP';

function build(){
  const st=document.createElement('style'); st.textContent=cssBuf; document.head.appendChild(st);
  const flowEl=$('#flow'), side=$('#side');
  let sideHtml='';
  flows.forEach((f,fi)=>{
    const list=screens.filter(s=>s.flow===f.id);
    const sec=document.createElement('section'); sec.className='fgroup'; sec.id='f-'+f.id;
    sec.innerHTML=`<header><h2>${LETTERS[fi]} · ${f.title}</h2><p>${f.desc}</p></header><div class="row"></div>`;
    const row=$('.row',sec);
    sideHtml+=`<h4>${LETTERS[fi]} · ${f.title}</h4>`;
    list.forEach((s,si)=>{
      s.num=`${LETTERS[fi]}${si+1}`;
      const slot=document.createElement('div'); slot.className='slot'; slot.id='s-'+s.id;
      const cls=['phone']; if(s.tab) cls.push('tabbed'); if(s.bar) cls.push('hasbar');
      slot.innerHTML=`<div class="label"><b>${s.num}</b>${s.title}</div>${s.note?`<div class="snote">${s.note}</div>`:''}
        <div class="${cls.join(' ')}" data-screen="${s.id}">${s.raw?s.html:`<div class="scr">${s.html}</div>`}${s.bar?`<div class="bar">${s.bar}</div>`:''}${s.tab?nav(s.tab):''}${s.overlay||''}<div class="toast" role="status"></div></div>`;
      row.appendChild(slot);
      sideHtml+=`<button data-jump="${s.id}"><b>${s.num}</b>${s.title}</button>`;
    });
    flowEl.appendChild(sec);
  });
  side.innerHTML=sideHtml;
  if(window.MH_LOGO) $$('img[data-logo]').forEach(i=>i.src=window.MH_LOGO);
  // set range fills
  $$('input[type=range]').forEach(r=>{const f=()=>r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%'); f(); r.addEventListener('input',f);});
  screens.forEach(s=>s.mount&&s.mount($(`[data-screen="${s.id}"]`)));
  state.cur=screens[0].id;
}

function phoneOf(id){ return $(`[data-screen="${id}"]`); }
function go(id,{push=true}={}){
  if(!byId[id]){ console.warn('No screen',id); return; }
  const moved = push && state.cur && state.cur!==id;
  if(moved) state.hist.push(state.cur);
  state.cur=id;
  const slot=$('#s-'+id), ph=phoneOf(id);
  $$('.slot').forEach(s=>s.classList.toggle('current',s===slot));
  $$('#side button').forEach(b=>b.classList.toggle('cur',b.dataset.jump===id));
  ph.classList.remove('enter'); void ph.offsetWidth; ph.classList.add('enter');
  const sc=$('.scr',ph); if(sc) sc.scrollTop=0;
  if(byId[id].onShow) byId[id].onShow(ph);
  if(state.play){ window.scrollTo({top:0}); }
  else{
    slot.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center',inline:'center'});
    ph.classList.add('flash'); setTimeout(()=>ph.classList.remove('flash'),900);
  }
  try{
    // App mode: every forward step is a real history entry, so the phone's back gesture works.
    if(state.app && moved) history.pushState({mh:id},'','#'+id);
    else history.replaceState({mh:id},'','#'+id);
  }catch(_){}
}
MH.go=go;
function back(fallback){
  // App mode: let the browser pop its entry; popstate below moves the screen.
  if(state.app && state.hist.length){ history.back(); return; }
  const prev=state.hist.pop(); go(prev||fallback||'home',{push:false});
}
function toast(el,msg){ const t=$('.toast',el.closest('.phone')); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
MH.toast=toast;

document.addEventListener('click',e=>{
  const t=e.target;
  const jump=t.closest('[data-jump]'); if(jump){ go(jump.dataset.jump,{push:false}); return; }
  if(!t.closest('.phone')) return;
  const radio=t.closest('[role=radio]');
  if(radio){ const g=radio.closest('[role=radiogroup]'); if(g) $$('[role=radio]',g).forEach(r=>{r.setAttribute('aria-checked',r===radio); r.classList.toggle('on',r===radio && r.classList.contains('chip'));}); }
  const cb=t.closest('[role=checkbox]'); if(cb) cb.setAttribute('aria-checked',cb.getAttribute('aria-checked')!=='true');
  const sw=t.closest('[role=switch]'); if(sw) sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true');
  const tg=t.closest('[data-toggle]'); if(tg) tg.setAttribute('aria-pressed',tg.getAttribute('aria-pressed')!=='true');
  const tab=t.closest('[role=tab]');
  if(tab){ const l=tab.closest('[role=tablist]'); $$('[role=tab]',l).forEach(x=>x.setAttribute('aria-selected',x===tab));
    const ph=tab.closest('.phone'); if(tab.dataset.panel){ $$('[data-tabpanel]',ph).forEach(p=>p.hidden=p.dataset.tabpanel!==tab.dataset.panel); } }
  const g=t.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go);
    if(g.dataset.toast){ const ph=phoneOf(g.dataset.go); setTimeout(()=>toast(ph.firstElementChild,g.dataset.toast),350); } return; }
  const b=t.closest('[data-back]'); if(b){ e.preventDefault(); back(b.dataset.back); return; }
  const ts=t.closest('[data-toast]'); if(ts){ toast(ts,ts.dataset.toast); return; }
});

/* ---------- overview controls ---------- */
function setPlay(on){
  state.play=on; $('#flow').classList.toggle('play',on);
  $('#vPlay').setAttribute('aria-pressed',on); $('#vOverview').setAttribute('aria-pressed',!on);
  $$('.slot').forEach(s=>s.classList.toggle('current',s.id==='s-'+state.cur));
  applyZoom();
  if(!on) $('#s-'+state.cur).scrollIntoView({block:'center'});
}
function applyZoom(){
  const z=+($('[data-zoom][aria-pressed=true]')||{dataset:{zoom:1}}).dataset.zoom;
  const fit=Math.min(1,(innerHeight-120)/900);
  $('#flow').style.zoom = state.play ? Math.min(z===1?fit:z,fit) : (innerWidth<430?(innerWidth-32)/390:z);
}
MH.boot=function(){
  build();
  $('#vPlay').onclick=()=>setPlay(true);
  $('#vOverview').onclick=()=>setPlay(false);
  $$('[data-zoom]').forEach(b=>b.onclick=()=>{ $$('[data-zoom]').forEach(x=>x.setAttribute('aria-pressed',x===b)); applyZoom(); });
  const tb=$('#themeBtn');
  const setTheme=d=>{ document.documentElement.dataset.theme=d?'dark':'light'; tb.setAttribute('aria-pressed',d); tb.innerHTML=ic(d?'sun':'moon')+`<span>${d?'Light':'Dark'} theme</span>`; try{localStorage.setItem('mh-theme',d?'dark':'light')}catch(_){} };
  tb.onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
  let saved=null; try{saved=localStorage.getItem('mh-theme')}catch(_){}
  setTheme(saved==='dark');
  const start=location.hash.slice(1);
  if(start && byId[start]){ state.cur=start; setPlay(true); go(start,{push:false}); }
  else applyZoom();
  addEventListener('resize',applyZoom);
  $('#count').textContent=`${screens.length} screens`;
};

/* App mode (app.html / the installable web app): one screen at a time, filling the device.
   No top bar or side list; starts at Splash unless the URL names a screen. */
MH.bootApp=function({start='splash'}={}){
  build();
  state.app=true; state.play=true;
  document.documentElement.classList.add('appmode');
  $('#flow').classList.add('play');
  let saved=null; try{saved=localStorage.getItem('mh-theme')}catch(_){}
  MH.setTheme(saved||'light');
  const h=location.hash.slice(1);
  const first=(h && byId[h] && h!=='splash') ? h : start;
  // Base entry: a deep link opened cold has Welcome underneath it, so back never leaves the app.
  if(first!==start){ state.cur='welcome'; history.replaceState({mh:'welcome'},'','#welcome'); go(first); }
  else go(first,{push:false});
  // The splash moves on by itself, and is replaced so back never returns to it.
  if(first==='splash') setTimeout(()=>{ if(state.cur==='splash') go('welcome',{push:false}); },2400);
  addEventListener('popstate',()=>{
    const id=location.hash.slice(1);
    if(!byId[id] || id===state.cur) return;
    const n=state.hist.length;
    if(n && state.hist[n-1]===id){ state.hist.pop(); go(id,{push:false}); }  // back
    else { state.hist.push(state.cur); go(id,{push:false}); }                 // forward
  });
};
/* Theme: 'light' | 'dark' | 'system'. Light is the default. */
MH.setTheme=function(mode){
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const apply=()=>{
    const dark = mode==='dark' || (mode==='system' && mq.matches);
    document.documentElement.dataset.theme = dark?'dark':'light';
    const m=$('meta[name="theme-color"]'); if(m) m.content = dark?'#111918':'#F8F3E9';
  };
  apply(); mq.onchange = mode==='system'?apply:null;
  try{ localStorage.setItem('mh-theme',mode); }catch(_){}
};
})();

</script>

<script>
/* E · Discover & matching: the match card, filters, a full profile, saying hi, hellos and the match moment. */
(function(){
const {i,appbar,av} = MH;

MH.flow('matching','Discover & matching','The hero of the app: one person at a time, scored on how you live. A compatibility ring and breakdown on every card, a full profile with both people\'s answers side by side, and a two-way "say hi" so nobody gets messaged out of the blue.');

/* ---------- Sample data: Ananya is the running example across Discover, chat and partner screens ---------- */
const A = {n:'Ananya',a:26,ini:'AR',job:'Product designer at a fintech startup',area:'HSR Layout',rent:'₹14,500',move:'Dec',pct:87};
/* label, score, your answer, her answer, how much it matters to you, to her (0 flexible, 1 important, 2 dealbreaker), shown on the card */
const BARS = [
  ['Budget',100,'₹14,500 share','Up to ₹16,000',1,1,1],
  ['Sleep',92,'Night owl','Night owl',1,1,1],
  ['Cleanliness',84,'Tidy enough','Spotless',1,2,1],
  ['Food',100,'Veg only','Veg only',1,1,1],
  ['Smoking',100,'Smoke-free home','Smoke-free home',2,2,1],
  ['Drinking',90,'Now and then is fine','Now and then is fine',0,0,0],
  ['House help',80,'Cook and cleaner','Cleaner only',0,0,0],
  ['Pets',70,'No pets, please','Pets are welcome',0,0,0],
  ['Guests',62,'Sometimes','Rarely',0,1,1]
];
const IMP=['Flexible','Important','Dealbreaker'];
const BOTH = [['moon','Night owls'],['leaf','Veg at home'],['noSmoke','No smoking']];

/* Compatibility ring. Shared with 06-chats.js through MH.ring. */
function ring(pct,size=116,stroke=10,label='match'){
  const r=(size-stroke)/2-1, c=+(2*Math.PI*r).toFixed(2), off=+(c*(1-pct/100)).toFixed(2), h=size/2;
  return `<div class="mt-ring" role="img" aria-label="${pct}% compatible" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="mt-track" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle class="mt-arc" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" data-c="${c}" data-off="${off}"/></svg>
    <div class="mt-mid"><div class="mt-pct" style="font-size:${Math.round(size*.26)}px">${pct}<small>%</small></div>${label?`<div class="mt-ml">${label}</div>`:''}</div>
  </div>`;
}
MH.ring = ring;

/* Replays the ring and bar fill when a screen is shown. Never throws. */
function animate(ph){
  try{
    if(!ph || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    ph.querySelectorAll('details[open]').forEach(d=>d.open=false);
    const arcs=[...ph.querySelectorAll('.mt-arc')], fills=[...ph.querySelectorAll('.mt-bt i')];
    arcs.forEach(a=>{a.style.transition='none'; a.style.strokeDashoffset=a.dataset.c;});
    fills.forEach(f=>{f.style.transition='none'; f.style.width='0%';});
    void ph.offsetWidth;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{

</div>`;
/* Hide the tip, or drop its question into the composer. */
const tipBind = ph=>{ if(!ph) return;

  const f=ph.querySelector('[data-fill]'), inp=ph.querySelector('.ct-in input');
  if(f && inp) f.addEventListener('click',()=>{ inp.value=f.dataset.fill; });
};

   · Gas cylinder 905 (Arjun) · Electricity, October 2,310 (Arjun). Total 6,030, each share 3,015.

.mn-x .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mn-big span{font:600 34px Poppins,sans-serif;color:var(--sub)}

.mn-step .iconbtn svg{width:16px;height:16px}

.mn-receipt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:1.5px dashed var(--border);background:transparent;color:var(--sub);font-weight:500;font-size:14px}
.mn-dhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 8px}
.mn-dhero .v{font:600 40px/1.1 Poppins,sans-serif;letter-spacing:-.8px;margin-top:6px}
.mn-thumb{display:flex;gap:14px;align-items:center;width:100%;padding:12px;border:0;text-align:left;color:var(--text)}
.mn-thumb .room{width:56px;height:72px;flex-shrink:0}
.mn-act{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:14px;line-height:1.4}
.mn-act .t{flex:1}
.mn-cmt{display:flex;gap:10px;align-items:flex-start}
.mn-cmt .bub{flex:1;padding:12px 14px;border-radius:4px 16px 16px 16px;background:var(--card);box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.mn-bill{padding:16px}
.mn-bill .top{display:flex;align-items:center;gap:12px}
.mn-bill .top .t{flex:1;min-width:0}
.mn-bill .top b{font-weight:600;font-size:15px;display:block}
.mn-bill .amt{font:600 17px Poppins,sans-serif;text-align:right}
.mn-bill .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mn-flow{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0 4px}
.mn-flow .arr{width:52px;height:2px;background:var(--border);position:relative}
.mn-flow .arr::after{content:"";position:absolute;right:-1px;top:-4px;width:8px;height:8px;border-top:2px solid var(--sub);border-right:2px solid var(--sub);transform:rotate(45deg)}
.mn-flow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.mn-done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:72px}
.mn-done .hero-ic{width:104px;height:104px;border-radius:50%}
.mn-done .hero-ic svg{width:52px;height:52px}
.mn-rent{padding:20px;border-radius:22px;background:linear-gradient(150deg,var(--tint),var(--card) 72%);box-shadow:var(--shadow)}
.mn-rent .v{font:600 36px/1.1 Poppins,sans-serif;letter-spacing:-.6px;margin:4px 0 6px}
.mn-rent .meter{margin:14px 0 8px;background:color-mix(in srgb,var(--border) 70%,transparent)}
.mn-hist{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.mn-hist + .mn-hist{border-top:1px solid var(--border)}
.mn-hist .t{flex:1;font-size:14px;line-height:1.4}
.mn-hist .t b{font-weight:600;display:block}
.mn-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mn-week button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;min-height:68px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--text);font-size:11px;font-weight:600}
.mn-week button span{color:var(--sub)}
.mn-week button b{font:600 17px Poppins,sans-serif}
.mn-week button i{width:5px;height:5px;border-radius:50%;background:var(--border)}
.mn-week button.past i{background:var(--fill-teal)}
.mn-week button[aria-current="date"]{background:var(--teal);color:#F8F3E9}
.mn-week button[aria-current="date"] span{color:#F8F3E9;opacity:.85}
.mn-week button[aria-current="date"] i{background:var(--lime)}
.mn-chore{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:68px;border:0;background:transparent;text-align:left;color:var(--text)}
.mn-chore + .mn-chore{border-top:1px solid var(--border)}
.mn-chore .cbox{width:26px;height:26px;border-radius:50%}
.mn-chore .t{flex:1;font-size:14px;line-height:1.4}
.mn-chore .t b{font-weight:600;display:block}
.mn-chore[aria-checked="true"] .t b{text-decoration:line-through;color:var(--sub)}
.mn-rota{width:100%;border-collapse:collapse;font-size:14px}
.mn-rota th{font-size:12px;font-weight:600;color:var(--sub);text-align:left;padding:12px 16px 8px}
.mn-rota td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle}
.mn-rota td b{display:block;font-weight:600}
.mn-rota .who{display:flex;align-items:center;gap:8px}
.mn-fair{padding:16px}
.mn-fair .r{display:grid;grid-template-columns:72px 1fr 28px;align-items:center;gap:12px;font-size:14px;margin-top:10px}
.mn-fair .r b{text-align:right;font-variant-numeric:tabular-nums}
.mn-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mn-days .chip{padding:0;min-width:0}
.mn-lock{display:flex;align-items:center;gap:6px;margin:-4px 0 0}
.mn-lock svg{width:14px;height:14px}
.mn-collect[hidden]{display:none}
`);
